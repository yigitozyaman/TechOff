<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 350px; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 15px; background: #f8f9fa; color: #333; margin: 0; }
    .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #25d366; padding-bottom: 8px; margin-bottom: 12px; }
    .header-row h3 { margin: 0; font-size: 15px; color: #075e54; }
    #openWaBtn {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 50%;
      background: #25d366; border: none; cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15); transition: transform 0.15s, background 0.2s;
      padding: 0;
    }
    #openWaBtn:hover { background: #1ebe5d; transform: scale(1.07); }
    #openWaBtn svg { width: 18px; height: 18px; fill: #ffffff; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .filter-row { display: flex; gap: 5px; align-items: stretch; }
    input[type="text"] { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; font-size: 12px; }
    select#chatLimit { padding: 6px 4px; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-family: inherit; font-size: 12px; font-weight: 600; color: #075e54; cursor: pointer; }
    #saveDefaultBtn { padding: 6px 8px; background: #34495e; color: white; border: none; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    #saveDefaultBtn:hover { background: #2c3e50; }
    input[type="date"] { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; font-size: 12.5px; }
    .hint { font-size: 10.5px; color: #666; margin-top: 3px; display: block; }
    .checkbox-group { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; font-size: 12px; cursor: pointer; }
    .checkbox-group input { cursor: pointer; }
    #startBatchBtn { width: 100%; padding: 10px; background: #075e54; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.2s; }
    #startBatchBtn:hover { background: #054c44; }
    #startBatchBtn:disabled { background: #95a5a6 !important; cursor: not-allowed; }
    #status { margin-top: 12px; font-size: 11.5px; line-height: 1.45; color: #2c3e50; background: #e8f5e9; padding: 9px; border-radius: 4px; display: none; word-break: break-word; }
  </style>
</head>
<body>
  <div class="header-row">
    <h3>Şantiye Rapor Arşivleyici</h3>
    <button type="button" id="openWaBtn" title="WhatsApp Web'i Aç">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16.004 3.2c-7.06 0-12.8 5.74-12.8 12.8 0 2.256.59 4.458 1.71 6.4L3.09 29.06l6.83-1.79a12.74 12.74 0 0 0 6.084 1.55h.006c7.058 0 12.796-5.74 12.796-12.8 0-3.42-1.332-6.636-3.75-9.054A12.716 12.716 0 0 0 16.004 3.2zm0 23.458h-.005a10.61 10.61 0 0 1-5.41-1.482l-.388-.23-4.053 1.063 1.082-3.952-.253-.403a10.593 10.593 0 0 1-1.627-5.654c0-5.868 4.775-10.642 10.648-10.642 2.843 0 5.516 1.108 7.526 3.12a10.573 10.573 0 0 1 3.116 7.526c0 5.87-4.775 10.644-10.642 10.644zm5.838-7.97c-.32-.16-1.893-.934-2.186-1.04-.293-.107-.507-.16-.72.16-.214.32-.827 1.04-1.014 1.254-.186.213-.373.24-.693.08-.32-.16-1.35-.498-2.573-1.588-.95-.848-1.593-1.895-1.78-2.215-.186-.32-.02-.493.14-.652.144-.143.32-.373.48-.56.16-.186.213-.32.32-.533.107-.213.053-.4-.027-.56-.08-.16-.72-1.734-.987-2.374-.26-.624-.524-.54-.72-.55l-.613-.01c-.214 0-.56.08-.854.4-.293.32-1.12 1.094-1.12 2.668s1.147 3.095 1.307 3.308c.16.213 2.257 3.446 5.468 4.832.764.33 1.36.527 1.825.674.767.244 1.465.21 2.016.127.615-.092 1.893-.774 2.16-1.52.267-.748.267-1.388.187-1.52-.08-.134-.293-.214-.613-.374z"/>
      </svg>
    </button>
  </div>
  
  <div class="form-group">
    <label for="filterKeyword">Sohbet Filtresi ve Taranacak Sohbet Adedi:</label>
    <div class="filter-row">
      <input type="text" id="filterKeyword" value="Günlük Raporlama" placeholder="Örn: Günlük Raporlama">
      <select id="chatLimit" title="En üstten itibaren taranacak maksimum sohbet adedi">
        <option value="10">10</option>
        <option value="25" selected>25</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="ALL">Hepsi</option>
      </select>
      <button type="button" id="saveDefaultBtn" title="Yazılı kelimeyi kalıcı varsayılan yap">Varsayılan</button>
    </div>
    <span class="hint" id="defaultHint">En güncel ilk 25 sohbet içinde filtreleme yapılır.</span>
  </div>

  <div class="form-group">
    <label for="startDate">Başlangıç Tarihi:</label>
    <input type="date" id="startDate" required>
  </div>
  
  <div class="form-group">
    <label for="endDate">Bitiş Tarihi:</label>
    <input type="date" id="endDate" required>
  </div>

  <label class="checkbox-group">
    <input type="checkbox" id="useWatermark" checked>
    <span>Fotoğraflara Şantiye/Tarih Damgası Ekle</span>
  </label>

  <button id="startBatchBtn">Taramayı ve Arşivlemeyi Başlat</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
